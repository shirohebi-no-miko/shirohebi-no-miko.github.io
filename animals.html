<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110f0e"><title>繁殖個体 | 白蛇の巫女</title><meta name="description" content="白蛇の巫女の繁殖個体と繁殖プロジェクトをご紹介します。"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#110f0e;color:#f5efe4;font-family:"Noto Serif JP",serif;line-height:1.8;background-image:radial-gradient(ellipse at 70% 0%,#39271e 0%,transparent 50%)}a{color:#e9c68d}header{padding:18px 5%;border-bottom:1px solid #6d5238;display:flex;justify-content:space-between;gap:12px;align-items:center}header strong{font-size:19px}header a{text-decoration:none}main{max-width:1080px;margin:auto;padding:55px 18px 100px}.eyebrow{color:#b99a6b;letter-spacing:.25em;font:12px sans-serif}h1{font-size:clamp(28px,6vw,45px);font-weight:500;margin:12px 0}.intro{color:#cfc3b5;max-width:700px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0 24px}button{border:1px solid #8e7351;background:#211b18;color:#f6e7d1;padding:10px 18px;border-radius:30px;cursor:pointer}button.active{background:#aa7d3d;color:#130e0a}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{border:1px solid #65503a;background:#1c1815;border-radius:12px;overflow:hidden}.photo{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#28201b,#3d3026);font-size:55px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:19px}.tag{font:12px sans-serif;color:#d9b87b;letter-spacing:.06em}.name{font-size:23px;margin:7px 0}.detail{font-size:14px;color:#d3c7b8;margin:5px 0}.muted{color:#ad9f8f;font-size:13px}.notice{border-left:3px solid #b78c4b;padding:13px 17px;background:#251e19;margin-top:40px;color:#d5c9b8;font-size:14px}footer{text-align:center;border-top:1px solid #4d3d2d;padding:25px;color:#b6a58d;font-size:12px}#error{color:#e9bd9d} </style></head><body>
<header><strong>白蛇の巫女 <small style="display:block;font:10px sans-serif;letter-spacing:.14em;color:#c3a67b">WHITE OPHIDIAN — SHRINE MAIDEN</small></strong><a href="index.html">← HOME</a></header>
<main><div class="eyebrow">OUR COLLECTION</div><h1>繁殖個体のご紹介</h1><p class="intro">白蛇を象徴に、多彩な爬虫類の魅力を伝える「白蛇の巫女」。繁殖計画に関わる個体を中心にご紹介します。掲載情報は随時更新します。</p>
<div class="controls"><button class="active" data-filter="all">すべて</button><button data-filter="ボールパイソン">ボールパイソン</button><button data-filter="コロンビアレインボーボア">コロンビアレインボーボア</button></div>
<p id="count" class="muted"></p><p id="error" role="alert"></p><div id="grid" aria-live="polite"></div><div class="notice">現在、第一種動物取扱業の登録準備中です。このページは繁殖個体の紹介を目的としたもので、生体の販売・予約・注文は受け付けていません。写真や一部遺伝情報は確認後に順次追加します。</div></main><footer>© <span id="year"></span> 白蛇の巫女</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();let animals=[];const grid=document.getElementById('grid');function el(tag,cls,value){const x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=value;return x}function render(filter='all'){grid.replaceChildren();const shown=animals.filter(a=>filter==='all'||a.species===filter);document.getElementById('count').textContent=`${shown.length} 個体を表示`;shown.forEach(a=>{const card=el('article','card');const photo=el('div','photo');if(a.photo && !/^https?:/i.test(a.photo) && !a.photo.includes('..')){const img=document.createElement('img');img.src=a.photo;img.alt=a.name+'の写真';img.loading='lazy';img.onerror=()=>photo.replaceChildren(el('span','', '🐍'));photo.append(img)}else photo.append(el('span','','🐍'));const body=el('div','body');body.append(el('div','tag',a.status||'繁殖個体'),el('h2','name',a.name),el('p','detail',a.species),el('p','detail',a.morph),el('p','muted','性別：'+(a.sex||'未確認')));if(a.note)body.append(el('p','muted',a.note));card.append(photo,body);grid.append(card)})}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));fetch('data/animals.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('データを取得できません');return r.json()}).then(d=>{animals=d.animals||[];render()}).catch(()=>{document.getElementById('error').textContent='個体データを読み込めませんでした。公開サイトで再読み込みしてください。'});</script></body></html>
