<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110f0e"><title>繁殖個体 | 白蛇の巫女</title><meta name="description" content="白蛇の巫女の繁殖個体と繁殖プロジェクトをご紹介します。"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#110f0e;color:#f5efe4;font-family:"Noto Serif JP",serif;line-height:1.8;background-image:radial-gradient(ellipse at 70% 0%,#39271e 0%,transparent 50%)}a{color:#e9c68d}header{padding:18px 5%;border-bottom:1px solid #6d5238;display:flex;justify-content:space-between;gap:12px;align-items:center}header strong{font-size:19px}header a{text-decoration:none}main{max-width:1080px;margin:auto;padding:55px 18px 100px}.eyebrow{color:#b99a6b;letter-spacing:.25em;font:12px sans-serif}h1{font-size:clamp(28px,6vw,45px);font-weight:500;margin:12px 0}.intro{color:#cfc3b5;max-width:700px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0 24px}button{border:1px solid #8e7351;background:#211b18;color:#f6e7d1;padding:10px 18px;border-radius:30px;cursor:pointer}button.active{background:#aa7d3d;color:#130e0a}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{border:1px solid #65503a;background:#1c1815;border-radius:12px;overflow:hidden}.photo{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#28201b,#3d3026);font-size:55px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:19px}.tag{font:12px sans-serif;color:#d9b87b;letter-spacing:.06em}.name{font-size:23px;margin:7px 0}.detail{font-size:14px;color:#d3c7b8;margin:5px 0}.muted{color:#ad9f8f;font-size:13px}.notice{border-left:3px solid #b78c4b;padding:13px 17px;background:#251e19;margin-top:40px;color:#d5c9b8;font-size:14px}footer{text-align:center;border-top:1px solid #4d3d2d;padding:25px;color:#b6a58d;font-size:12px}#error{color:#e9bd9d}.card-link{display:block;color:inherit;text-decoration:none;height:100%}.card-link:hover,.card-link:focus-visible{outline:2px solid #d9b87b;outline-offset:2px}.pedigree{margin-top:32px;border:1px solid #806442;border-radius:12px;padding:24px;background:#1d1814}.pedigree h2{font-weight:500;color:#e7c78c}.parents{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.parent{border:1px solid #5e4b36;border-radius:9px;padding:14px;background:#251e18}.parent small{color:#c6ab82}.parent a,.related a{color:#f1d4a4}.related{margin-top:18px}.related li{margin:6px 0}.back{display:inline-block;margin:12px 0 22px}.evidence{color:#bcb0a1;font-size:13px;overflow-wrap:anywhere}.detail-wrap{max-width:790px;margin:auto}.empty{color:#b9aa96}.pill{font:12px sans-serif;color:#d9b87b} </style></head><body>
<header><strong>白蛇の巫女 <small style="display:block;font:10px sans-serif;letter-spacing:.14em;color:#c3a67b">WHITE OPHIDIAN — SHRINE MAIDEN</small></strong><a href="index.html">← HOME</a></header>
<main><div class="eyebrow">OUR COLLECTION</div><h1>繁殖個体のご紹介</h1><p class="intro">白蛇を象徴に、多彩な爬虫類の魅力を伝える「白蛇の巫女」。繁殖計画に関わる個体を中心にご紹介します。掲載情報は随時更新します。</p>
<div class="controls"><button class="active" data-filter="all">すべて</button><button data-filter="ボールパイソン">ボールパイソン</button><button data-filter="コロンビアレインボーボア">コロンビアレインボーボア</button><button data-filter="コーンスネーク">コーンスネーク</button><button data-filter="セイブシシバナヘビ">シシバナ</button><button data-filter="カリフォルニアキングスネーク">カリキン</button><button data-filter="サルバトールモニター">モニター</button></div>
<p id="count" class="muted"></p><div id="profile" hidden></div><p id="error" role="alert"></p><div id="grid" aria-live="polite"></div><div class="notice">現在、第一種動物取扱業の登録準備中です。このページは繁殖個体の紹介を目的としたもので、生体の販売・予約・注文は受け付けていません。写真や一部遺伝情報は確認後に順次追加します。</div></main><footer>© <span id="year"></span> 白蛇の巫女</footer>
<script>
'use strict';
document.getElementById('year').textContent=new Date().getFullYear();
let animals=[],clutches=[];
const grid=document.getElementById('grid'),profile=document.getElementById('profile');
const params=new URLSearchParams(location.search);
function el(tag,cls,value){const x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=String(value);return x}
function link(id,label){const a=el('a','',label);a.href='animals.html?id='+encodeURIComponent(id);return a}
function byId(id){return animals.find(a=>a.id===id)}
function publicParent(id){return id?byId(id):null}
function photoFor(a){const photo=el('div','photo');if(a.photo && !/^([a-z]+:|\/\/)/i.test(a.photo) && !a.photo.includes('..') && !a.photo.startsWith('/')){const img=el('img');img.src=a.photo;img.alt=a.name+'の写真';img.loading='lazy';img.onerror=()=>photo.replaceChildren(el('span','','🐍'));photo.append(img)}else photo.append(el('span','','🐍'));return photo}
function render(filter='all'){
 grid.replaceChildren();const shown=animals.filter(a=>filter==='all'||a.species===filter);
 document.getElementById('count').textContent=`${shown.length} 個体を表示`;
 shown.forEach(a=>{const card=el('article','card'),anchor=link(a.id,'');anchor.className='card-link';anchor.setAttribute('aria-label',a.name+'の詳細を見る');const body=el('div','body');body.append(el('div','tag',a.status||'繁殖個体'),el('h2','name',a.name),el('p','detail',a.species),el('p','detail',a.morph),el('p','muted','性別：'+(a.sex||'未確認')));if(a.listing_category==='ロマン枠')body.append(el('p','pill','ロマン枠・繁殖計画外'));if(a.note)body.append(el('p','muted',a.note));body.append(el('p','tag','個体情報を見る →'));anchor.append(photoFor(a),body);card.append(anchor);grid.append(card)})
}
function evidenceText(obj){if(!obj)return '資料未登録';const s=[obj.status,obj.source||obj.evidence].filter(v=>typeof v==='string'&&v.trim());return s.join('／')||'資料未登録'}
function section(title){const s=el('section','pedigree');s.append(el('h2','',title));return s}
function parentBox(role,id){const b=el('div','parent');b.append(el('small','',role));const p=el('p');const a=publicParent(id);if(a)p.append(link(a.id,a.name));else p.textContent=id?'個体情報は非公開または未登録':'情報なし';b.append(p);return b}
function clutchMatches(c,a){return c.mother_id===a.id||c.father_id===a.id||(Array.isArray(c.father_candidate_ids)&&c.father_candidate_ids.includes(a.id))||(Array.isArray(c.offspring_ids)&&c.offspring_ids.includes(a.id))}
function showProfile(id){
 const a=byId(id);document.querySelector('.controls').hidden=true;grid.hidden=true;profile.hidden=false;profile.replaceChildren();document.getElementById('count').textContent='';
 const back=el('a','back','← 個体一覧に戻る');back.href='animals.html';profile.append(back);
 if(!a){profile.append(el('p','empty','該当する公開個体情報はありません。'));return}
 const wrap=el('div','detail-wrap');wrap.append(el('div','eyebrow','INDIVIDUAL PROFILE'),el('h1','',a.name),el('p','pill',a.id+' ／ '+(a.status||'状態未登録')));
 wrap.append(photoFor(a),el('p','detail','種類：'+a.species),el('p','detail','モルフ：'+(a.morph||'情報なし')),el('p','detail','性別：'+(a.sex||'未確認')));
 if(a.listing_category==='ロマン枠')wrap.append(el('p','pill','ロマン枠・繁殖計画外'));
 if(a.note)wrap.append(el('p','muted',a.note));
 const pedigree=section('血統情報｜血統絵巻');const parents=el('div','parents');parents.append(parentBox('父',a.father_id),parentBox('母',a.mother_id));pedigree.append(parents);
 pedigree.append(el('p','evidence','親子関係の根拠：'+evidenceText(a.parentage)),el('p','evidence','遺伝子型の根拠：'+evidenceText(a.genotype_evidence)));
 const children=animals.filter(x=>x.father_id===a.id||x.mother_id===a.id);
 if(children.length){const div=el('div','related');div.append(el('h3','','公開中の子個体'));const ul=el('ul');children.forEach(x=>{const li=el('li');li.append(link(x.id,x.name));ul.append(li)});div.append(ul);pedigree.append(div)}
 wrap.append(pedigree);
 const records=clutches.filter(c=>clutchMatches(c,a));
 const breeding=section('クラッチ・繁殖記録');
 if(!records.length)breeding.append(el('p','empty','公開できるクラッチ記録はまだありません。'));
 else records.forEach(c=>{const item=el('div','parent');item.append(el('h3','',c.id||'クラッチ（番号未登録）'));
 for(const [label,key] of [['交配日','mating_date'],['産卵日','laid_date'],['孵化日','hatched_date'],['産卵数','egg_count'],['孵化数','hatched_count']])if(c[key]!==undefined&&c[key]!==null)item.append(el('p','detail',label+'：'+c[key]));
 const parentIds=[['父',c.father_id],['母',c.mother_id]];parentIds.forEach(([role,pid])=>{if(pid){const p=el('p','detail',role+'：');const pa=byId(pid);p.append(pa?link(pid,pa.name):el('span','','非公開または未登録'));item.append(p)}});
 if(Array.isArray(c.offspring_ids)&&c.offspring_ids.length){const p=el('p','detail','子個体：');c.offspring_ids.forEach((oid,i)=>{if(i)p.append(document.createTextNode('、'));const child=byId(oid);p.append(child?link(oid,child.name):el('span','','非公開または未登録'))});item.append(p)}
 breeding.append(item)});
 wrap.append(breeding);profile.append(wrap);document.title=a.name+' | 血統絵巻 | 白蛇の巫女';
}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));
Promise.all([fetch('data/animals.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('animals');return r.json()}),fetch('data/clutches.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('clutches');return r.json()})]).then(([d,c])=>{animals=(d.animals||[]).filter(a=>a.public===true);clutches=c.clutches||[];if(params.has('id'))showProfile(params.get('id'));else render()}).catch(()=>{document.getElementById('error').textContent='データを読み込めませんでした。公開サイトで再読み込みしてください。'});
</script></body></html>
